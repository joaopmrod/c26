 {wp:'kolocep', t:'noite', nome:'Donje Čelo — Koločep', dia:'Noite 1', txt:'⚠ Navily: FUNDEIO PROIBIDO (zona regulamentada) → apanhar boia paga. Fundo areia/ervas; aberta a NW (o maestral morre ao pôr do sol). Plano B: Suđurađ (Šipan, +3 nm) ou Gornje Čelo. Briefing de manobra de boia antes de chegar.', navu:'https://www.navily.com/mouillage/donje-celo/40611', wiki:'Kolo%C4%8Dep',

  pq:'O banho mais "postal" da semana, exatamente a caminho de Lastovo — mantido do plano original.'},
 {wp:'skrivena', t:'noite', nome:'Skrivena Luka — Lastovo (Parque Natural)', dia:'Noite 3', txt:'"Porto Escondido": entrada discreta, proteção excelente. ~30 boias + pontão PORTO ROSSO com água e eletricidade SEM obrigação de restaurante. Fundear ao fundo 8–10 m. Taxa PN Lastovo ~30–40 €. Caminhada ao farol de Struga.', navu:'https://www.navily.com/port/skrivena-luka-portorus/2586', wiki:'Lastovo',
  pq:'Substitui Mali Lago: a mesma proteção com mais capacidade e serviços (água a meio da semana sem marina!), o farol de Struga ao pôr do sol e o mesmo céu escuro — Lastovo é o local mais escuro da Croácia.'},
 {wp:'proizd', t:'banho', nome:'Proizd — Vela Luka', dia:'Dia 4 (banho/almoço)', txt:'Eleita a praia mais bonita do Adriático (Bili Bok): calhau branco, água cristalina, um só bar. Fundeadouro SÓ DE DIA, lado abrigado do vento (com maestral: SE, no canal Proizd–Korčula).', navu:'https://www.navily.com/carte?q=Proizd', wiki:'Proizd',
  pq:'A joia nova da rota: a 6–7 nós a ponta W de Korčula era inalcançável; a 7,5–8 nós (combustível deixou de ser restrição) cabe com folga. É o "uau" que substitui a ideia rejeitada de ir a Hvar.'},
 {wp:'gradina', t:'noite', nome:'Uvala Gradina — Vela Luka', dia:'Noite 4', txt:'Ancoradouro livre clássico na entrada da baía de Vela Luka: lama/areia 4–8 m, boa tença, ilhéu Gubeša fecha a entrada. Opcional: dinghy/salto ao cais de Vela Luka (água, gelo, frescos).', navu:'https://www.navily.com/carte?q=Uvala%20Gradina%20Vela%20Luka', wiki:'Vela_Luka',
  pq:'Noite grátis, segura e estratégica: posiciona o barco para a costa sul de Korčula no dia seguinte e permite reforço de água/frescos em Vela Luka — alívio da disciplina de água com 8 pessoas.'},
 {wp:'pupnatska', t:'banho', nome:'Pupnatska Luka — Korčula S', dia:'Dia 5 (banho/almoço)', txt:'Enseada de calhau, areia que segura bem (rocha junto à costa), konoba na praia. Aberta a S — ok com maestral.', navu:'https://www.navily.com/carte?q=Pupnatska%20Luka', wiki:'Pupnat',

  pq:'A outra joia nova: tarde inteira de praia de areia na véspera do regresso — substitui o braço de Pelješac/Ston do plano original e deixa o último dia curto (18,5 nm).'},

// ---------- Marcas de 30 min ao longo da rota (traço perpendicular, a 7 nós) ----------
const SPEED_KN = 7;
const MARK_INTERVAL_M = SPEED_KN * 1852 * 0.5; // metros percorridos em 30 min
function addTimeTicks(latlngs, color, grp){
  const segs = [];
  let total = 0;
  for(let i=0;i<latlngs.length-1;i++){
    const a = L.latLng(latlngs[i]), b = L.latLng(latlngs[i+1]);
    const d = a.distanceTo(b);
    segs.push({a,b,d});
    total += d;
  }
  let mark = MARK_INTERVAL_M, acc = 0, n = 0;
  for(const s of segs){
    while(mark <= acc + s.d){
      n++;
      const t = (mark - acc) / s.d;
      const lat = s.a.lat + (s.b.lat - s.a.lat) * t;
      const lng = s.a.lng + (s.b.lng - s.a.lng) * t;
      const brng = Math.atan2((s.b.lng - s.a.lng) * Math.cos(lat*Math.PI/180), s.b.lat - s.a.lat);
      const perp = brng + Math.PI/2;
      const halfM = 250; // metade do comprimento do traço (m)
      const dLat = (halfM * Math.cos(perp)) / 111320;
      const dLng = (halfM * Math.sin(perp)) / (111320 * Math.cos(lat*Math.PI/180));
      L.polyline([[lat-dLat, lng-dLng],[lat+dLat, lng+dLng]], {color, weight:2.5, opacity:.9})
        .bindTooltip(`${(n*30/60).toFixed(1)} h`, {permanent:false, direction:'top'})
        .addTo(grp);
      mark += MARK_INTERVAL_M;
    }
    acc += s.d;
  }
}

// ---------- Desenhar rotas ----------
const overlays = {};
legs.forEach(l=>{
  const latlngs = l.pts.map(k=>WP[k]);
  const grp = L.layerGroup();
  L.polyline(latlngs, {color:'#fff', weight:6, opacity:.6}).addTo(grp);
  const line = L.polyline(latlngs, {color:C[l.d], weight:3.5, opacity:.95}).addTo(grp);
  line.bindPopup(`<div class="popup"><h3>${l.nome}</h3><p>${l.info}</p></div>`);
  line.bindTooltip(`D${l.d}`, {permanent:false, sticky:true, className:'daylab'});
  addTimeTicks(latlngs, C[l.d], grp);
  grp.addTo(map);
  overlays[`<span class="sw" style="background:${C[l.d]}"></span>${l.nome}`] = grp;
});

// ---------- Variante D6: almoço em Žuljana (tracejado) ----------
(()=>{
  const pts = ['badija','peljE','zuljana','kanalSE','mljetSE','saplunara'].map(k=>WP[k]);
  const grp = L.layerGroup();
  L.polyline(pts, {color:'#fff', weight:6, opacity:.5}).addTo(grp);
  const line = L.polyline(pts, {color:C[6], weight:3, opacity:.95, dashArray:'8 8'}).addTo(grp);
  line.bindPopup(`<div class="popup"><h3>Dia 6 · VARIANTE — almoço em Žuljana</h3><p>Parte as 32 nm em <b>14 + 18 nm</b>: Badija → Žuljana (ETA ~11:50), banho/almoço fundeados até às 14:00 (virada a W — não ficar para a tarde), depois Žuljana → Saplunara (ETA ~16:25).</p><p>Decidir no próprio dia: com maestral bom, a rota direta à vela vale a tarde inteira de praia em Saplunara; sem vento ou com a tripulação cansada, esta variante descansa.</p></div>`);
  line.bindTooltip('D6 variante', {sticky:true, className:'daylab'});
  addTimeTicks(pts, C[6], grp);
  grp.addTo(map);
  overlays[`<span class="sw" style="background:repeating-linear-gradient(90deg,${C[6]} 0 6px,transparent 6px 10px)"></span>Dia 6 · Variante — almoço em Žuljana`] = grp;
})();

// ---------- Marcadores (foto Wikipédia quando disponível + justificação) ----------
function popupHTML(p, lat, lon, img){
  const t = TIPO[p.t];
  return `<div class="popup" style="max-width:280px">
    ${img?`<img src="${img}" alt="${p.nome}" style="width:100%;max-height:160px;object-fit:cover;border-radius:6px;margin-bottom:6px">`:''}
    <h3>${p.nome}</h3>
    <span class="tag" style="background:${t.cor}">${t.rot} · ${p.dia}</span>
    <p>${p.txt}</p>
    <p style="background:#f2f7f2;border-left:3px solid #588157;padding:5px 8px;border-radius:0 4px 4px 0"><b>Porquê este ponto:</b> ${p.pq}</p>
    <p>${lat.toFixed(4)}°N ${lon.toFixed(4)}°E · <a href="${p.navu}" target="_blank">Navily ▸</a> · <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">Google Maps</a></p></div>`;
}
const grpPts = L.layerGroup().addTo(map);
pontos.forEach(p=>{
  const [lat,lon] = WP[p.wp];
  const t = TIPO[p.t];
  const m = L.circleMarker([lat,lon], {radius:8, color:'#fff', weight:2, fillColor:t.cor, fillOpacity:1})
   .bindPopup(popupHTML(p, lat, lon, null), {maxWidth:300})
   .bindTooltip(p.nome.split('—')[0].trim(), {direction:'top', offset:[0,-6]})
   .addTo(grpPts);
  if(p.wiki){
    fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${p.wiki}`)
      .then(r=>r.ok?r.json():null)
      .then(j=>{ if(j && j.thumbnail && j.thumbnail.source){
          m.setPopupContent(popupHTML(p, lat, lon, j.thumbnail.source.replace(/\/(\d+)px-/, '/480px-')));
      }}).catch(()=>{});
  }
});
overlays['<b>Pontos de paragem</b>'] = grpPts;

L.control.layers({'Mapa':osm}, overlays, {collapsed:true, position:'topright'}).addTo(map);

// ---------- Título e legenda ----------
const title = L.control({position:'topleft'});
title.onAdd = ()=>{ const d=L.DomUtil.create('div','titlebox');
  d.innerHTML = `<h1>⛵ Plano ALTERNATIVO (check-in 17h) — "Julija" (Bali Catsmart)</h1>
  <p><b>18–25 Jul 2026</b> · 8 pessoas · ~176 nm · ~23,5 h motor a 7,5 nós</p>
  <p>Dubrovnik → Koločep → Mljet → Lastovo → <b>volta a Korčula</b> (Proizd) → Saplunara → Dubrovnik</p>
  <p>Check-in <b>17:00</b> · Marina ACI Korčula à <b>quarta-feira</b> (meio da semana)</p>
  <p style="color:#888">Clica nas linhas e nos pontos. Coordenadas aproximadas — confirmar na carta.</p>`;
  return d; };
title.addTo(map);

const leg = L.control({position:'bottomleft'});
leg.onAdd = ()=>{ const d=L.DomUtil.create('div','legend');
  let h = '<b>Rotas</b><br>';
  legs.forEach(l=>h+=`<span class="sw" style="background:${C[l.d]}"></span>Dia ${l.d}<br>`);
  h+=`<span class="sw" style="background:repeating-linear-gradient(90deg,${C[6]} 0 6px,transparent 6px 10px)"></span>D6 variante (Žuljana)<br>`;
  h += '<b>Pontos</b><br>';
  Object.values(TIPO).forEach(t=>h+=`<span class="dot" style="background:${t.cor}"></span>${t.rot}<br>`);
  d.innerHTML = h; return d; };
leg.addTo(map);

map.fitBounds(L.latLngBounds(Object.values(WP)).pad(0.06));
</script>
