// ---------- Marcas de 30 min ao longo da rota (traço perpendicular) ----------
function addTimeTicks(latlngs, color, grp, speedKn){
  const markIntervalM = speedKn * 1852 * 0.5; // metros em 30 min
  const segs = [];
  let total = 0;
  for(let i=0;i<latlngs.length-1;i++){
    const a = L.latLng(latlngs[i]), b = L.latLng(latlngs[i+1]);
    const d = a.distanceTo(b);
    segs.push({a,b,d});
    total += d;
  }
  let mark = markIntervalM, acc = 0, n = 0;
  for(const s of segs){
    while(mark <= acc + s.d){
      n++;
      const t = (mark - acc) / s.d;
      const lat = s.a.lat + (s.b.lat - s.a.lat) * t;
      const lng = s.a.lng + (s.b.lng - s.a.lng) * t;
      const brng = Math.atan2((s.b.lng - s.a.lng) * Math.cos(lat*Math.PI/180), s.b.lat - s.a.lat);
      const perp = brng + Math.PI/2;
      const halfM = 250;
      const dLat = (halfM * Math.cos(perp)) / 111320;
      const dLng = (halfM * Math.sin(perp)) / (111320 * Math.cos(lat*Math.PI/180));
      L.polyline([[lat-dLat, lng-dLng],[lat+dLat, lng+dLng]], {color, weight:2.5, opacity:.9})
        .bindTooltip(`${(n*30/60).toFixed(1)} h`, {permanent:false, direction:'top'})
        .addTo(grp);
      mark += markIntervalM;
    }
    acc += s.d;
  }
  return total;
}

// ---------- Vento previsto por dia (consulta 10 Jul · Open-Meteo + Windguru ECMWF/GFS) ----------
// from = direção DE ONDE sopra (graus); a seta desenha-se a apontar PARA ONDE sopra.
// frac = posição da seta ao longo da pernada (0=início, 1=fim). from:null = calmaria (círculo).
const WIND = {
  1:[{frac:0.5,  from:135,  label:'Jugo SE 5–8 kn (raj. 20–25) · cai ao anoitecer', tone:'light'}],
  2:[{frac:0.25, from:null, label:'manhã: calmaria', tone:'calm'},
     {frac:0.75, from:270,  label:'tarde: W 5–7 kn', tone:'light'}],
  3:[{frac:0.5,  from:225,  label:'0–6 kn · motor', tone:'calm'}],
  4:[{frac:0.5,  from:112,  label:'ESE 8–10 kn (popa) ⚠ GFS diz NW — confirmar D-3', tone:'mod'}],
  5:[{frac:0.35, from:112,  label:'manhã: ESE 7–10 kn', tone:'mod'},
     {frac:0.85, from:315,  label:'fim de tarde: NW 12–16 (raj. 20–26)', tone:'strong'}],
  6:[{frac:0.25, from:22,   label:'manhã: bora NNE raj. 25–30 · alivia 12h', tone:'strong'},
     {frac:0.75, from:315,  label:'tarde: NW 6–12 kn', tone:'mod'}],
  7:[{frac:0.3,  from:45,   label:'manhã: NE 2–5 kn', tone:'calm'},
     {frac:0.75, from:225,  label:'tarde: SW 5–9 kn', tone:'light'}]
};
const WINDCOL = {calm:'#94a3b8', light:'#0ea5e9', mod:'#0d9488', strong:'#d97706'};

function pointAtFrac(latlngs, frac){
  const pts = latlngs.map(p=>L.latLng(p));
  const segs = []; let total = 0;
  for(let i=0;i<pts.length-1;i++){ const d = pts[i].distanceTo(pts[i+1]); segs.push({a:pts[i],b:pts[i+1],d}); total += d; }
  let target = total*frac, acc = 0;
  for(const s of segs){
    if(target <= acc + s.d){ const t = (target-acc)/s.d;
      return [s.a.lat+(s.b.lat-s.a.lat)*t, s.a.lng+(s.b.lng-s.a.lng)*t]; }
    acc += s.d;
  }
  return [pts[pts.length-1].lat, pts[pts.length-1].lng];
}

function addWindArrows(latlngs, day, grp){
  (WIND[day]||[]).forEach(w=>{
    const pos = pointAtFrac(latlngs, w.frac);
    const col = WINDCOL[w.tone];
    const glyph = w.from==null
      ? `<svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="${col}" stroke-width="3.5"/></svg>`
      : `<svg width="20" height="20" viewBox="0 0 24 24" style="transform:rotate(${(w.from+180)%360}deg)"><path d="M12 2 L18 12 L13.6 10.6 L13.6 22 L10.4 22 L10.4 10.6 L6 12 Z" fill="${col}"/></svg>`;
    const html = `<div style="display:flex;flex-direction:column;align-items:center;gap:1px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));">
      ${glyph}<span style="font-size:10px;font-weight:700;background:rgba(255,255,255,.93);padding:1px 6px;border-radius:9px;color:#334155;white-space:nowrap;">${w.label}</span></div>`;
    L.marker(pos, {icon: L.divIcon({className:'windarrow', html, iconSize:[240,40], iconAnchor:[120,20]}), interactive:false, keyboard:false}).addTo(grp);
  });
}

function popupHTML(p, lat, lon, img){
  const t = TIPO[p.t];
  const credit = p.img ? ' <span style="color:#999">(foto: Navily)</span>' : '';
  return `<div class="popup" style="max-width:280px">
    ${img?`<img src="${img}" alt="${p.nome}" style="width:100%;max-height:160px;object-fit:cover;border-radius:6px;margin-bottom:6px">`:''}
    <h3>${p.nome}</h3>
    <span class="tag" style="background:${t.cor}">${t.rot} · ${p.dia}</span>
    ${p.horas?`<p style="font-weight:600;color:#1d3557">🕐 ${p.horas}</p>`:''}
    <p>${p.txt}</p>
    <p style="background:#f2f7f2;border-left:3px solid #588157;padding:5px 8px;border-radius:0 4px 4px 0"><b>Porquê este ponto:</b> ${p.pq}</p>
    <p>${lat.toFixed(4)}°N ${lon.toFixed(4)}°E · <a href="${p.navu}" target="_blank">Navily ▸</a> · <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">Google Maps</a>${credit}</p></div>`;
}

// ---------- Constrói um plano: devolve estrutura para a matriz de camadas ----------
function buildPlan(cfg){
  const items = []; // {key, label, color, layer, dashed, isPts}

  cfg.legs.forEach(l=>{
    const latlngs = l.pts.map(k=>cfg.WP[k]);
    const grp = L.layerGroup();
    L.polyline(latlngs, {color:'#fff', weight:6, opacity:.6}).addTo(grp);
    const line = L.polyline(latlngs, {color:C[l.d], weight:3.5, opacity:.95}).addTo(grp);
    const totalM = addTimeTicks(latlngs, C[l.d], grp, cfg.speed);
    addWindArrows(latlngs, l.d, grp);
    const totalNm = totalM / 1852, totalH = totalNm / cfg.speed;
    const wtxt = (WIND[l.d]||[]).map(w=>w.label).join(' · ');
    line.bindPopup(`<div class="popup"><h3>${l.nome}</h3><p>${l.info}</p><p><b>Total a navegar:</b> ${totalH.toFixed(1)} h (${totalNm.toFixed(1)} nm a ${cfg.speed} nós)</p>${wtxt?`<p style="background:#eef6fb;border-left:3px solid #0a66c2;padding:5px 8px;border-radius:0 4px 4px 0"><b>🌬 Vento previsto:</b> ${wtxt}</p>`:''}</div>`);
    line.bindTooltip(`D${l.d}`, {permanent:false, sticky:true, className:'daylab'});
    items.push({key:`d${l.d}`, label:`Dia ${l.d}`, color:C[l.d], layer:grp});
  });

  if(cfg.variant){
    const pts = cfg.variant.pts.map(k=>cfg.WP[k]);
    const grp = L.layerGroup();
    L.polyline(pts, {color:'#fff', weight:6, opacity:.5}).addTo(grp);
    const line = L.polyline(pts, {color:C[6], weight:3, opacity:.95, dashArray:'8 8'}).addTo(grp);
    const totalM = addTimeTicks(pts, C[6], grp, cfg.speed);
    addWindArrows(pts, 6, grp);
    const totalNm = totalM / 1852, totalH = totalNm / cfg.speed;
    const wtxtV = (WIND[6]||[]).map(w=>w.label).join(' · ');
    line.bindPopup(`<div class="popup"><h3>${cfg.variant.nome}</h3><p>${cfg.variant.info}</p><p><b>Total a navegar:</b> ${totalH.toFixed(1)} h (${totalNm.toFixed(1)} nm a ${cfg.speed} nós)</p>${wtxtV?`<p style="background:#eef6fb;border-left:3px solid #0a66c2;padding:5px 8px;border-radius:0 4px 4px 0"><b>🌬 Vento previsto:</b> ${wtxtV}</p>`:''}</div>`);
    line.bindTooltip('variante', {sticky:true, className:'daylab'});
    items.push({key:'variant', label:'Variante D6', color:C[6], layer:grp, dashed:true});
  }

  const grpPts = L.layerGroup();
  cfg.pontos.forEach(p=>{
    const [lat,lon] = cfg.WP[p.wp];
    const t = TIPO[p.t];
    const m = L.circleMarker([lat,lon], {radius:8, color:'#fff', weight:2, fillColor:t.cor, fillOpacity:1})
     .bindPopup(popupHTML(p, lat, lon, p.img || null), {maxWidth:300})
     .bindTooltip(`<b>${p.nome.split('—')[0].trim()}</b>${p.horas?`<br>${p.horas}`:''}`, {direction:'top', offset:[0,-6]})
     .addTo(grpPts);
    if(!p.img && p.wiki){
      fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${p.wiki}`)
        .then(r=>r.ok?r.json():null)
        .then(j=>{ if(j && j.thumbnail && j.thumbnail.source){
            m.setPopupContent(popupHTML(p, lat, lon, j.thumbnail.source.replace(/\/(\d+)px-/, '/480px-')));
        }}).catch(()=>{});
    }
  });
  items.push({key:'pts', label:'Pontos de paragem', layer:grpPts, isPts:true});

  return items;
}

// ---------- Monta todos os planos, adiciona só o plano por omissão ao mapa ----------
const planData = PLANS.map(cfg=>({cfg, items: buildPlan(cfg)}));
planData.forEach(({cfg, items})=>{
  if(cfg.id === DEFAULT_VISIBLE) items.forEach(it=>it.layer.addTo(map));
});

// ---------- Painel de camadas: matriz plano × dia ----------
const PanelControl = L.control({position:'topright'});
PanelControl.onAdd = function(){
  const div = L.DomUtil.create('div','planpanel');
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);

  // lookup rápido: matrix[planId][rowKey] = {chk, it} (preenchido à medida que se criam as células)
  const matrix = {};
  planData.forEach(({cfg})=> matrix[cfg.id] = {});

  const table = document.createElement('table');

  // ---- cabeçalho: canto + uma coluna por plano ----
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const corner = document.createElement('th');
  corner.className = 'corner';
  corner.textContent = 'Todos ⇄';
  corner.title = 'Ligar/desligar tudo';
  headRow.appendChild(corner);

  const planColChecks = {}; // planId -> checkbox de coluna
  planData.forEach(({cfg, items})=>{
    const th = document.createElement('th');
    th.title = cfg.sub;
    const lbl = document.createElement('span');
    lbl.className = 'plabel';
    lbl.textContent = PLAN_SHORT[cfg.id] || cfg.label;
    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = (cfg.id === DEFAULT_VISIBLE);
    planColChecks[cfg.id] = chk;
    th.appendChild(lbl);
    th.appendChild(chk);
    headRow.appendChild(th);

    chk.addEventListener('change', ()=>{
      items.forEach(it=>{
        const cell = matrix[cfg.id][it.key];
        if(!cell) return;
        cell.chk.checked = chk.checked;
        if(chk.checked){ it.layer.addTo(map); } else { map.removeLayer(it.layer); }
      });
      updateRowChecks();
      updateCornerCheck();
    });
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  // ---- corpo: uma linha por dia/variante/pontos ----
  const tbody = document.createElement('tbody');
  const rowChecks = {}; // rowKey -> checkbox de linha

  ROWS.forEach(row=>{
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    const swatch = document.createElement('span');
    if(row.isPts){ swatch.className='dot'; swatch.style.background='#333'; }
    else { swatch.className='sw'; swatch.style.background = row.dashed ? `repeating-linear-gradient(90deg,${row.color} 0 4px,transparent 4px 7px)` : row.color; }
    th.appendChild(swatch);
    th.appendChild(document.createTextNode(row.label));
    const rowChk = document.createElement('input');
    rowChk.type = 'checkbox';
    rowChk.style.marginLeft = '6px';
    rowChk.checked = false;
    th.appendChild(rowChk);
    rowChecks[row.key] = rowChk;
    tr.appendChild(th);

    planData.forEach(({cfg, items})=>{
      const td = document.createElement('td');
      const it = items.find(i=>i.key===row.key);
      if(!it){
        td.className = 'empty';
        td.textContent = '—';
      } else {
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = (cfg.id === DEFAULT_VISIBLE);
        td.appendChild(chk);
        matrix[cfg.id][row.key] = {chk, it};

        chk.addEventListener('change', ()=>{
          if(chk.checked){ it.layer.addTo(map); } else { map.removeLayer(it.layer); }
          updateColCheck(cfg.id);
          updateRowCheck(row.key);
          updateCornerCheck();
        });
      }
      tr.appendChild(td);
    });

    rowChk.addEventListener('change', ()=>{
      planData.forEach(({cfg})=>{
        const cell = matrix[cfg.id][row.key];
        if(!cell) return;
        cell.chk.checked = rowChk.checked;
        if(rowChk.checked){ cell.it.layer.addTo(map); } else { map.removeLayer(cell.it.layer); }
      });
      planData.forEach(({cfg})=> updateColCheck(cfg.id));
      updateCornerCheck();
    });

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  div.appendChild(table);

  function updateColCheck(planId){
    const cells = Object.values(matrix[planId]);
    planColChecks[planId].checked = cells.length>0 && cells.every(c=>c.chk.checked);
  }
  function updateRowCheck(rowKey){
    const cells = planData.map(({cfg})=>matrix[cfg.id][rowKey]).filter(Boolean);
    rowChecks[rowKey].checked = cells.length>0 && cells.every(c=>c.chk.checked);
  }
  function updateRowChecks(){ ROWS.forEach(r=>updateRowCheck(r.key)); }
  function updateCornerCheck(){
    const allCells = planData.flatMap(({cfg})=>Object.values(matrix[cfg.id]));
    corner.style.fontWeight = allCells.every(c=>c.chk.checked) ? '700' : '400';
  }

  // estado inicial dos checks de linha/coluna
  planData.forEach(({cfg})=> updateColCheck(cfg.id));
  updateRowChecks();
  updateCornerCheck();

  corner.addEventListener('click', ()=>{
    const allOn = planData.flatMap(({cfg})=>Object.values(matrix[cfg.id])).every(c=>c.chk.checked);
    const turnOn = !allOn;
    planData.forEach(({cfg, items})=>{
      items.forEach(it=>{
        const cell = matrix[cfg.id][it.key];
        if(!cell) return;
        cell.chk.checked = turnOn;
        if(turnOn){ it.layer.addTo(map); } else { map.removeLayer(it.layer); }
      });
      planColChecks[cfg.id].checked = turnOn;
    });
    updateRowChecks();
    updateCornerCheck();
  });

  return div;
};
PanelControl.addTo(map);

// ---------- Título ----------
const title = L.control({position:'topleft'});
title.onAdd = ()=>{ const d=L.DomUtil.create('div','titlebox');
  d.innerHTML = `<h1>⛵ Sailing Week Croácia — Todos os Planos</h1>
  <p><b>18–25 Jul 2026</b> · 8 pessoas · "Julija" (Bali Catsmart)</p>
  <p style="color:#888">Ativa/desativa cada plano e cada dia no painel à direita. Clica nas linhas e nos pontos para detalhes.</p>
  <p style="color:#0a66c2">🌬 Setas = vento previsto por pernada (consulta 10 Jul, ECMWF/Windguru) — apontam para onde o vento sopra. Laranja = rajadas fortes. Círculo = calmaria.</p>`;
  return d; };
title.addTo(map);

map.fitBounds(L.latLngBounds(Object.values(PLAN_ORIGINAL.WP)).pad(0.06));
</script>
